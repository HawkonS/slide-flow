name: Checks

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt python-pptx

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  renderer:
    name: Renderer tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/wps-renderer
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: services/wps-renderer/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q wps_renderer tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Run frontend unit tests
        run: npm run test:pwa:unit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run frontend browser tests
        run: npm run test:pwa:browser
