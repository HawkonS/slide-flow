# Example reverse proxy for a SlideFlow instance.
# Replace the server_name and TLS section for the deployment environment.
# The application accepts PPT uploads up to 10 GiB. The extra 1 MiB permits
# multipart headers without raising the business-level file-size ceiling.

server {
    listen 80;
    server_name slide-flow.example.com;

    client_max_body_size 10241m;
    client_body_timeout 2h;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 2h;
        proxy_send_timeout 2h;
    }
}
