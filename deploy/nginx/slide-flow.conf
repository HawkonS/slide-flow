# Example reverse proxy for a SlideFlow instance.
# Replace the server_name and TLS section for the deployment environment.
# The application accepts up to 512 MiB of imported files plus multipart
# overhead, so the proxy must allow the same request size on both upload paths.

server {
    listen 80;
    server_name slide-flow.example.com;

    client_max_body_size 513m;
    client_body_timeout 10m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }
}
